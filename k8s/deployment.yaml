apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: mcp-server-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: mcp-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gke-mcp-server
  template:
    metadata:
      labels:
        app: gke-mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
        - name: mcp-server
          image: gcr.io/open-source-apps-001/python-fastmcp:a28841a38063893a5da9cf3bc4e0ef6a07d59a22
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gke-mcp-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: gke-mcp-server
  ports:
    - port: 80
      targetPort: 8080
